name: Test
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: true
          go-version: '1.27.0-rc.2'
      - name: Run tests
        run: go test -v -race -coverprofile="coverage.out" ./...
      - name: Verify dependency injection
        run: make wire-check
      - name: Verify generator output
        run: make gen-check
